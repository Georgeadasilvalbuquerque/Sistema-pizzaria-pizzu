<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meu carrinho — Pizzaria Pizzu</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="../css/styles.css" />
    <link rel="stylesheet" href="../css/pizzu-theme.css" />
  </head>
  <body data-page="cart" class="pizzu-body">
    <nav class="navbar navbar-expand-lg pizzu-navbar shadow-sm mb-4">
      <div class="container-fluid px-3 px-lg-4">
        <a class="navbar-brand d-flex align-items-center gap-2" href="../index.html">
          <i class="bi bi-shop-window text-pizzu-orange fs-4" aria-hidden="true"></i>
          <span>Pizzaria Pizzu</span>
        </a>
        <div class="d-flex align-items-center gap-2 ms-auto">
          <a href="./carrinho.html" class="btn btn-outline-secondary btn-sm position-relative active" aria-current="page">
            <i class="bi bi-cart3 me-1"></i>Carrinho
            <span id="cart-badge-nav" class="badge bg-danger position-absolute top-0 start-100 translate-middle rounded-pill d-none">0</span>
          </a>
          <button id="login-btn" type="button" class="btn btn-primary btn-sm">
            <i class="bi bi-person-circle me-1"></i>Login
          </button>
        </div>
      </div>
    </nav>

    <div class="container pb-5">
      <div class="row justify-content-center">
        <div class="col-lg-9 col-xl-8">
          <nav aria-label="breadcrumb" class="mb-3">
            <ol class="breadcrumb small mb-0">
              <li class="breadcrumb-item"><a href="../index.html">Inicio</a></li>
              <li class="breadcrumb-item active" aria-current="page">Carrinho</li>
            </ol>
          </nav>

          <h1 class="h3 fw-bold mb-2 d-flex align-items-center gap-2">
            <i class="bi bi-cart-check text-pizzu-orange"></i>Meu carrinho
          </h1>
          <p class="text-muted small mb-4" id="cart-page-subtitle">
            Revise os itens antes de finalizar. Para comprar, e necessario entrar na sua conta.
          </p>

          <div id="message" class="alert alert-info border-0 shadow-sm d-none" role="alert"></div>

          <div id="cart-page-empty" class="card border-0 shadow-sm text-center py-5 px-3">
            <i class="bi bi-cart-x display-4 text-muted mb-3"></i>
            <p class="mb-3 text-muted">Seu carrinho esta vazio.</p>
            <a href="../index.html" class="btn btn-primary rounded-pill px-4"><i class="bi bi-arrow-left me-2"></i>Voltar ao cardapio</a>
          </div>

          <div id="cart-page-filled" class="d-none">
            <div class="card border-0 shadow-sm mb-4">
              <div class="card-body p-0">
                <ul id="cart-page-list" class="list-group list-group-flush"></ul>
              </div>
              <div class="card-footer bg-white border-top py-3 px-4">
                <div class="d-flex justify-content-between align-items-center mb-3">
                  <span class="fw-semibold">Total</span>
                  <strong id="cart-page-total" class="fs-4 text-pizzu-orange">R$ 0,00</strong>
                </div>
                <div class="d-grid gap-2 d-md-flex flex-md-row justify-content-md-between align-items-md-center">
                  <a href="../index.html" class="btn btn-outline-secondary rounded-pill order-2 order-md-1">
                    <i class="bi bi-plus-circle me-2"></i>Continuar comprando
                  </a>
                  <button id="checkout-btn" type="button" class="btn btn-primary rounded-pill px-4 order-1 order-md-2">
                    <i class="bi bi-lock-fill me-2"></i>Finalizar compra
                  </button>
                </div>
                <p class="small text-muted mt-3 mb-0 text-center text-md-start" id="cart-checkout-hint"></p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <footer class="pizzu-footer mt-auto">
      <div class="pizzu-footer__container py-3">
        <p class="text-center mb-0 small opacity-75">
          <a href="../index.html" class="text-white text-decoration-none"><i class="bi bi-house-door me-1"></i>Voltar ao inicio</a>
        </p>
      </div>
    </footer>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script src="../api/config.js"></script>
    <script src="../api/http.js"></script>
    <script src="../api/client.js"></script>
    <script src="../js/cart-guest.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/main.js"></script>
  </body>
</html>
