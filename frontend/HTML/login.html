<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login — Pizzaria Pizzu</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="../css/styles.css" />
    <link rel="stylesheet" href="../css/pizzu-theme.css" />
  </head>
  <body data-page="login" class="pizzu-body pizzu-auth-shell d-flex align-items-center py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6 col-xl-5">
          <div class="text-center mb-4">
            <a href="../index.html" class="text-decoration-none d-inline-flex align-items-center justify-content-center gap-2 text-dark">
              <i class="bi bi-shop-window text-pizzu-orange fs-1" aria-hidden="true"></i>
              <span class="fs-3 fw-bold">Pizzaria Pizzu</span>
            </a>
          </div>

          <div class="card pizzu-auth-card">
            <div class="card-body p-4 p-md-5">
              <h1 class="h3 fw-bold mb-2">Login</h1>
              <p class="text-muted mb-4">Acesse com sua conta de teste.</p>

              <div id="message" class="alert alert-info border-0 shadow-sm mb-4" role="alert">Entre com email e senha.</div>

              <form id="login-form" novalidate>
                <div class="mb-3">
                  <label class="form-label fw-semibold small" for="login-email">Email</label>
                  <div class="input-group">
                    <span class="input-group-text" id="addon-email"><i class="bi bi-envelope" aria-hidden="true"></i></span>
                    <input
                      id="login-email"
                      name="email"
                      type="email"
                      class="form-control"
                      inputmode="email"
                      autocomplete="username"
                      autocapitalize="off"
                      spellcheck="false"
                      placeholder="seu@email.com"
                      aria-describedby="addon-email"
                      required
                    />
                  </div>
                </div>
                <div class="mb-4">
                  <label class="form-label fw-semibold small" for="login-password">Senha</label>
                  <div class="input-group">
                    <span class="input-group-text" id="addon-pass"><i class="bi bi-lock" aria-hidden="true"></i></span>
                    <input
                      id="login-password"
                      name="password"
                      type="password"
                      class="form-control"
                      autocomplete="current-password"
                      autocapitalize="off"
                      spellcheck="false"
                      placeholder="Senha"
                      aria-describedby="addon-pass"
                      required
                    />
                  </div>
                </div>
                <button type="submit" class="btn btn-primary w-100 rounded-pill py-2 mb-3 fw-semibold">
                  <i class="bi bi-box-arrow-in-right me-2" aria-hidden="true"></i>Entrar
                </button>
              </form>

              <div class="d-grid gap-2">
                <a href="./cadastro.html" class="btn btn-outline-secondary rounded-pill">
                  <i class="bi bi-people me-2"></i>Contas de teste
                </a>
                <a href="../index.html" class="btn btn-link text-decoration-none text-secondary">
                  <i class="bi bi-arrow-left me-1"></i>Voltar ao inicio
                </a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script src="../api/config.js"></script>
    <script src="../api/http.js"></script>
    <script src="../api/client.js"></script>
    <script src="../js/cart-guest.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/main.js"></script>
  </body>
</html>
